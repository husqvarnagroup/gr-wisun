# rumdl reads .markdownlint.yaml as well, but only when no rumdl config is present, and the
# exclude list below has no equivalent in that format. Keeping one file avoids a second one
# that looks authoritative while being silently ignored.

[global]
exclude = [
    # the conda recipe is the upstream GNU Radio template, copyright GNU Radio
    # contributors; restyling it would only make it harder to update
    ".conda",
    # generated by gr_modtool along with the bindings
    "python/wisun/bindings",
    "build",
]
disable = [
    # The documents here use setext headings with = for their top-level sections, which
    # reads as several level-one headings in one document.
    "MD025",
    # The README embeds <img> tags for the screenshots, which Markdown image syntax
    # cannot size.
    "MD033",
]

[MD013]
# 80 columns, as for the rest of the project. Tables and code blocks are exempt: padding a
# table to align its separators and quoting a command verbatim both need the room.
line-length = 80
tables = false
code-blocks = false
