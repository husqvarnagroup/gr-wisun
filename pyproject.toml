# This file configures the development tooling only. The module itself is built and
# installed with CMake, as described in README.md, not with a Python build backend.

# Declared so that uv knows which interpreter the tooling needs. Nothing here is built or
# published; the Python code is installed by CMake along with the rest of the module.
[project]
name = "gr-wisun-tooling"
version = "0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.ruff]
# the project's own limit, as recorded in .editorconfig; ruff's default of 88 is narrower
# than anything in the tree
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle - the tree documents every module, class and function
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "RUF",  # ruff's own
    "SIM",  # flake8-simplify
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # one of these two has to go; the tree puts the summary on the line after """
    "D213",  # multi-line-summary-second-line
    # The non-ASCII characters here are deliberate typography, not paste damage: a narrow
    # no-break space between a value and its unit, an en dash in prose, and box-drawing
    # characters in the table util.tabular_pretty_print draws.
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    # A two-branch if/else is often clearer than a conditional expression, and the tree
    # uses whichever reads better in context.
    "SIM108",  # if-else-block-instead-of-if-exp
    # Would require a class per message for exceptions that are raised once and read by a
    # person; the message at the raise site is the useful place for it.
    "TRY003",  # raise-vanilla-args
    # These two contradict each other - one wants implicit concatenation, the other
    # explicit - and the tree uses both styles where they read best. ISC004 is kept,
    # because an unparenthesized concatenation inside a collection really is a trap.
    "ISC002",  # multi-line-implicit-string-concatenation
    "ISC003",  # explicit-string-concatenation
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# generated by gr_modtool and regenerated in place; not ours to style
"python/wisun/bindings/*" = ["D", "E", "I", "UP", "RUF", "B", "SIM", "TRY", "BLE"]
# the apps are scripts, so a module docstring is all the documentation they need
"apps/*" = ["D103"]

[dependency-groups]
# Development tooling. Install with `uv sync --group dev`, or run a single tool with
# `uv run --group dev <tool>`. None of this is needed to build or use the module.
dev = [
    "codespell",
    "pytest",
    "ruff",
    "rumdl",
    "yamllint",
]
