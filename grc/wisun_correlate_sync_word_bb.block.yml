id: wisun_correlate_sync_word_bb
label: correlate_sync_word_bb
category: '[Wi-SUN]'

templates:
  imports: from gnuradio import wisun
  make: wisun.correlate_sync_word_bb(${sfd}, ${fec})

parameters:
- id: sfd
  label: Start-of-Frame Delimiter
  dtype: int
- id: fec
  label: Forward Error Correction
  dtype: bool
  default: 'False'
  options: ['False', 'True']
  option_labels: ['No', 'Yes']

inputs:
- domain: stream
  dtype: byte

outputs:
- domain: stream
  dtype: byte

file_format: 1
