title: Wi-SUN OOT Module
version: 1.0
brief: Out-of-tree module with Wi-SUN support blocks for GNU Radio.
tags:  # arbitrary; see CGRAN for what other authors use
  - sdr
  - wisun
  - wireshark
author:
  - Andreas Müller <andreas.mueller@husqvarnagroup.com>
copyright_owner:
  - GARDENA GmbH
license:
  - GPL-3.0-or-later
gr_supported_version:
  - 3.10
repo:  # no public URL for this repository yet
website:  # no separate project website
# icon: a URL to a square image used as an icon, if there is one
description: |-
  This OOT module implements basic blocks that allow receiving Wi-SUN
  packets, which can be fed into Wireshark. This allows using SDR
  hardware as a Wi-SUN sniffer. At the moment, only the SUN FSK PHY is
  supported, with or without the NRNSC forward error correction of
  Wi-SUN PHY type 1; there is no OFDM and no transmit path.
file_format: 1
