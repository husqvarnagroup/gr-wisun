name: code checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: install uv
        uses: astral-sh/setup-uv@v5
      # The app scripts have no .py extension, so they have to be named
      # explicitly - which is why nothing had ever linted them.
      - name: run ruff
        run: uv run --group dev ruff check python/ apps/gr-wisun-*
      - name: run codespell
        run: uv run --group dev codespell
      - name: check Markdown
        run: uv run --group dev rumdl check .
      - name: check YAML
        run: uv run --group dev yamllint .
      # Nothing else can catch a block definition missing from the install
      # list: the build passes and the block works from Python, it just never
      # reaches GNU Radio Companion.
      - name: check every block definition is installed
        run: |
          for yml in grc/*.block.yml; do
            grep -q "$(basename "$yml")" grc/CMakeLists.txt \
              || { echo "$yml is missing from grc/CMakeLists.txt"; exit 1; }
          done

  build_and_test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            doxygen \
            git \
            gnuradio \
            gnuradio-dev
          pipx install pytest
      - name: run Python code tests
        run: |
          pytest
      - name: build
        run: |
          mkdir build
          cd build
          cmake ..
          make
      - name: run signal processing block tests
        run: |
          cd build
          make TEST_ARGS="--output-on-failure" test
